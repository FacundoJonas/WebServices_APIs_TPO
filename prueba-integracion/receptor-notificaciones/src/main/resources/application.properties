# =====================================================================
#  Receptor - Módulo Notificaciones (Equipo 6)
#  Todo valor ${VARIABLE:defecto} se puede cambiar con una variable de
#  entorno, sin recompilar (ver despliegue/receptor.env.ejemplo).
# =====================================================================
spring.application.name=receptor-notificaciones

# 0.0.0.0 = escucha en TODAS las interfaces de red de la VM.
# Si se pusiera 127.0.0.1, sólo respondería desde la misma VM.
server.address=${HOST:0.0.0.0}
server.port=${PUERTO:8082}

# Nombre visible del módulo en /api/v1/ping y en los logs
deliverygo.modulo=${MODULO_NOMBRE:notificaciones}

# Orígenes permitidos para CORS (el Portal React en otra PC).
# "*" acepta cualquiera; en la demo se puede restringir, ej: http://192.168.1.50:5173
deliverygo.cors.origenes=${CORS_ORIGENES:*}

# ---------------- Base de datos propia del módulo ----------------
# H2 en archivo: los datos sobreviven a un reinicio del servicio.
# "-v2": el esquema cambió (plantillas en tabla, intentos de entrega). La base
# anterior (./datos/notificaciones) no se toca ni se borra: queda al lado.
spring.datasource.url=${DB_URL:jdbc:h2:file:./datos/notificaciones-v2;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_CLAVE:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Consola web de H2 (ver las tablas desde el navegador). APAGADA por defecto:
# quien accede a la consola puede ejecutar SQL y código en la VM.
# Para usarla: H2_CONSOLA=true y entrar desde la misma VM (o con túnel SSH).
spring.h2.console.enabled=${H2_CONSOLA:false}
spring.h2.console.path=/h2-console
# Sólo si H2_CONSOLA_REMOTA=true acepta conexiones desde otras PCs (riesgoso: usar sólo en red aislada)
spring.h2.console.settings.web-allow-others=${H2_CONSOLA_REMOTA:false}

# ---------------- Swagger / OpenAPI ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------- Salud (para monitorear la VM) ----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------- Logs ----------------
# El correlationId aparece en cada línea para seguir una petición entre VMs
logging.pattern.level=%5p [cid:%X{correlationId:-}]
spring.jmx.enabled=false

# ---------------- Simulación de fallas (para probar al emisor) ----------------
# Demora artificial antes de responder. Ej: 8000 para provocar timeout en el emisor.
deliverygo.simulacion.demora-ms=${SIMULAR_DEMORA_MS:0}
# Porcentaje (0-100) de solicitudes que responden 503 a propósito.
deliverygo.simulacion.porcentaje-falla=${SIMULAR_FALLA_PORCENTAJE:0}

# ---------------- Entrega simulada y reintentos ----------------
# Tope de intentos de entrega, contando el primero (regla "reintentos limitados").
deliverygo.envio.max-intentos=${MAX_INTENTOS:3}
# Canales que arrancan caídos, separados por coma (ej. EMAIL). Vacío = todos operativos.
# También se cambian en caliente desde la página o con PUT /api/v1/channels/{canal}.
deliverygo.envio.canales-caidos=${CANALES_CAIDOS:}
