# =====================================================================
#  Emisor - Módulo Pedidos (Equipo 3)
#  Todo valor ${VARIABLE:defecto} se puede cambiar con una variable de
#  entorno, sin recompilar (ver despliegue/emisor.env.ejemplo).
# =====================================================================
spring.application.name=emisor-pedidos

# 0.0.0.0 = escucha en TODAS las interfaces de red de la VM.
server.address=${HOST:0.0.0.0}
server.port=${PUERTO:8081}

deliverygo.modulo=${MODULO_NOMBRE:pedidos}
deliverygo.cors.origenes=${CORS_ORIGENES:*}

# ---------------- Receptor (la OTRA máquina virtual) ----------------
# IP o nombre de la VM donde corre receptor-notificaciones.
# Ej: http://192.168.1.22:8082   (NUNCA localhost si está en otra VM)
deliverygo.receptor.url=${RECEPTOR_URL:http://localhost:8082}
# Tiempo máximo para ABRIR la conexión TCP (VM apagada, IP errónea, firewall que descarta)
deliverygo.receptor.timeout-conexion-ms=${RECEPTOR_TIMEOUT_CONEXION_MS:3000}
# Tiempo máximo para RECIBIR la respuesta una vez conectado (receptor lento o colgado)
deliverygo.receptor.timeout-lectura-ms=${RECEPTOR_TIMEOUT_LECTURA_MS:5000}

# ---------------- Base de datos propia del módulo ----------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./datos/pedidos;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_CLAVE:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Consola web de H2 (ver las tablas desde el navegador). APAGADA por defecto:
# quien accede a la consola puede ejecutar SQL y código en la VM.
# Para usarla: H2_CONSOLA=true y entrar desde la misma VM (o con túnel SSH).
spring.h2.console.enabled=${H2_CONSOLA:false}
spring.h2.console.path=/h2-console
# Sólo si H2_CONSOLA_REMOTA=true acepta conexiones desde otras PCs (riesgoso: usar sólo en red aislada)
spring.h2.console.settings.web-allow-others=${H2_CONSOLA_REMOTA:false}

# ---------------- Swagger / OpenAPI ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------- Salud ----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------- Logs ----------------
logging.pattern.level=%5p [cid:%X{correlationId:-}]
spring.jmx.enabled=false
